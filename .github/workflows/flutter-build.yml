name: Flutter Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform folder
        run: flutter create --project-name libre_notes --platforms=android .

      - name: Set Android minimum SDK
        run: perl -0pi -e 's/minSdk = flutter\.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts

      - name: Set Android app identity
        run: |
          cat > android/app/src/main/res/drawable/libre_vault_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#F4F7F5" android:pathData="M20,0h68a20,20 0,0 1,20 20v68a20,20 0,0 1,-20 20H20a20,20 0,0 1,-20 -20V20a20,20 0,0 1,20 -20z" />
            <path android:fillColor="#14B8A6" android:pathData="M54,17l29,11v22c0,20 -12,34 -29,42C37,84 25,70 25,50V28z" />
            <path android:fillColor="#075985" android:fillAlpha="0.88" android:pathData="M54,28l18,7v15c0,13 -7,22 -18,28c-11,-6 -18,-15 -18,-28V35z" />
            <path android:fillColor="#FFFFFF" android:pathData="M45,49a9,9 0,1 1,18 0v7h4v20H41V56h4zM51,56h6v-7a3,3 0,1 0,-6 0z" />
          </vector>
          EOF
          perl -0pi -e 's/android:label="[^"]+"/android:label="Libre Vault"/' android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's/android:icon="@mipmap\/ic_launcher"/android:icon="@drawable\/libre_vault_icon"/' android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's/android:roundIcon="@mipmap\/ic_launcher_round"/android:roundIcon="@drawable\/libre_vault_icon"/' android/app/src/main/AndroidManifest.xml

      - name: Use stable debug signing key
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app code
        run: flutter analyze lib --no-fatal-infos

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: libre-notes-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
