name: Flutter build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web-and-android:
    name: Web and Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --project-name libre_notes --platforms=web,android .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build web
        run: flutter build web --release

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: libre-notes-web
          path: build/web

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: libre-notes-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows platform folder
        run: flutter create --project-name libre_notes --platforms=windows .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: libre-notes-windows
          path: build/windows/x64/runner/Release
