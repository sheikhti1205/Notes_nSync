<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes'nync Logo — Adaptive Theme</title>
    <style>
        :root {
            /* === DEFAULT: DARK MODE === */
            --bg-body: radial-gradient(circle at 50% 30%, #161030 0%, #0b061f 100%);
            --bg-box: linear-gradient(145deg, #1a103c, #0f0a24);
            --box-shadow:
                inset 0 1.5px 1px rgba(255,255,255,0.08),
                0 30px 60px -15px rgba(0,0,0,0.7),
                0 0 0 1px rgba(255,255,255,0.04);
            --text-color: #ffffff;
            --text-shadow: 0 10px 30px rgba(0,0,0,0.3);
            --border-color: rgba(255,255,255,0.12);
            --btn-bg: rgba(255,255,255,0.06);
            --btn-hover: rgba(255,255,255,0.12);
            --btn-text: #e0d0f0;
            --sidebar-bg: rgba(0,0,0,0.25);
            --sidebar-border: rgba(255,255,255,0.06);
            --label-color: rgba(255,255,255,0.5);
            --active-btn-bg: rgba(255,255,255,0.15);
            --active-btn-border: rgba(255,255,255,0.3);
            --glow-color: rgba(255,128,229,0.25);
        }

        /* === LIGHT MODE === */
        [data-theme="light"] {
            --bg-body: radial-gradient(circle at 50% 30%, #f0eef8 0%, #e2ddf0 100%);
            --bg-box: linear-gradient(145deg, #ffffff, #f5f3fc);
            --box-shadow:
                inset 0 1.5px 1px rgba(255,255,255,1),
                0 20px 50px -10px rgba(0,0,0,0.15),
                0 0 0 1px rgba(0,0,0,0.04);
            --text-color: #1a103c;
            --text-shadow: 0 4px 12px rgba(0,0,0,0.08);
            --border-color: rgba(0,0,0,0.1);
            --btn-bg: rgba(0,0,0,0.04);
            --btn-hover: rgba(0,0,0,0.08);
            --btn-text: #4a3a6a;
            --sidebar-bg: rgba(255,255,255,0.6);
            --sidebar-border: rgba(0,0,0,0.06);
            --label-color: rgba(0,0,0,0.4);
            --active-btn-bg: rgba(0,0,0,0.1);
            --active-btn-border: rgba(0,0,0,0.2);
            --glow-color: rgba(255,128,229,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-body);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        .app {
            display: flex;
            gap: 32px;
            align-items: center;
            padding: 40px;
        }

        body.android-splash .app {
            width: 100vw;
            height: 100vh;
            padding: 0;
            justify-content: center;
            align-items: center;
        }

        body.android-splash .sidebar,
        body.android-splash .app-name,
        body.android-splash .replay-btn {
            display: none !important;
        }

        body.android-splash .stage {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0;
        }

        body.android-splash .logo-wrap {
            width: min(54vw, 280px);
            height: min(54vw, 280px);
        }

        body.android-splash .logo-box {
            border-radius: min(13vw, 66px);
        }

        body.android-splash svg {
            width: min(38vw, 198px);
            height: min(38vw, 198px);
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 220px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--sidebar-border);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: all 0.5s ease;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--label-color);
            transition: color 0.5s ease;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--btn-bg);
            color: var(--btn-text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
            flex: 1;
            min-width: 0;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--btn-hover);
            transform: translateY(-1px);
        }

        .btn.active {
            background: var(--active-btn-bg);
            border-color: var(--active-btn-border);
            font-weight: 600;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .palette-swatch {
            aspect-ratio: 1;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            position: relative;
        }

        .palette-swatch:hover { transform: scale(1.1); }
        .palette-swatch.active { border-color: var(--active-btn-border); }

        .swatch-check {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.2s ease;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .palette-swatch.active .swatch-check { opacity: 1; }

        /* ===== MAIN STAGE ===== */
        .stage {
            perspective: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        .logo-wrap {
            width: 300px;
            height: 300px;
            position: relative;
            transform-style: preserve-3d;
            opacity: 0;
            transform: scale(0.85) rotate(-2deg);
            animation: boxEnter 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .logo-wrap::before {
            content: "";
            position: absolute;
            inset: -30px;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
            filter: blur(25px);
            opacity: 0;
            animation: fadeIn 1.2s ease forwards 0.4s;
            z-index: -1;
            pointer-events: none;
            transition: background 0.5s ease;
        }

        .logo-box {
            width: 100%;
            height: 100%;
            border-radius: 72px;
            background: var(--bg-box);
            box-shadow: var(--box-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: visible;
            transform-style: preserve-3d;
            transition: all 0.5s ease;
        }

        svg {
            width: 200px;
            height: 200px;
            overflow: visible;
            filter: drop-shadow(0 10px 8px rgba(0,0,0,0.35));
        }

        .n-path {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            will-change: stroke-dashoffset;
        }

        .n-fold {
            opacity: 0;
            transform-origin: 125px 145px;
            transform: scale(0.4) rotate(-15deg);
        }

        .line {
            height: 12px;
            border-radius: 6px;
            position: absolute;
            right: 45px;
            opacity: 0;
            transform: translateX(60px);
        }

        .app-name {
            color: var(--text-color);
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 1.5px;
            opacity: 0;
            transform: translateY(12px);
            text-shadow: var(--text-shadow);
            transition: color 0.5s ease, text-shadow 0.5s ease;
        }

        .replay-btn {
            padding: 10px 28px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--btn-bg);
            color: var(--btn-text);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
        }
        .replay-btn:hover {
            background: var(--btn-hover);
            transform: translateY(-2px);
        }
        .replay-btn:active { transform: translateY(0); }

        @keyframes boxEnter {
            to { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes drawN { to { stroke-dashoffset: 0; } }
        @keyframes foldReveal { to { opacity: 1; transform: scale(1) rotate(0deg); } }
        @keyframes slideIn { to { transform: translateX(0); opacity: 1; } }
        @keyframes textUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="android-splash">

<div class="app">
    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-label">Theme</div>
            <div class="btn-row">
                <button class="btn active" data-mode="dark" onclick="setTheme('dark')">Dark</button>
                <button class="btn" data-mode="light" onclick="setTheme('light')">Light</button>
            </div>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-label">Color Palette</div>
            <div class="palette-grid" id="paletteGrid"></div>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-label">Actions</div>
            <button class="btn" style="width:100%" onclick="replayAnimation()">Replay Animation</button>
        </div>
    </div>

    <!-- ===== MAIN STAGE ===== -->
    <div class="stage" id="stage">
        <div class="logo-wrap" id="logoWrap">
            <div class="logo-box" id="logoBox">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" id="logoSvg">
                    <defs>
                        <linearGradient id="n-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" id="stop1" stop-color="#ff80e5"/>
                            <stop offset="50%" id="stop2" stop-color="#9d50bb"/>
                            <stop offset="100%" id="stop3" stop-color="#6e48aa"/>
                        </linearGradient>
                    </defs>
                    <path class="n-path" id="nPath" d="M45,160 C45,160 45,40 45,40 L125,160 L125,40" stroke="url(#n-grad)" stroke-width="32"/>
                    <path class="n-fold" id="nFold" d="M125,160 L125,130 L150,145 Z" fill="url(#n-grad)"/>
                </svg>

                <div class="line" id="line1" style="width:45px; top:88px; background:linear-gradient(90deg, var(--c1), var(--c2));"></div>
                <div class="line" id="line2" style="width:45px; top:116px; background:linear-gradient(90deg, var(--c2), var(--c3));"></div>
                <div class="line" id="line3" style="width:45px; top:144px; background:linear-gradient(90deg, var(--c3), var(--c4));"></div>
            </div>
        </div>
        <div class="app-name">Notes'nync</div>
    </div>
</div>

<script>
    // ===== COLOR PALETTES =====
    const palettes = {
        neon:      { c1: "#ff80e5", c2: "#9d50bb", c3: "#6e48aa", c4: "#4facfe", name: "Neon" },
        sunset:    { c1: "#ff6b6b", c2: "#feca57", c3: "#ff9ff3", c4: "#54a0ff", name: "Sunset" },
        ocean:     { c1: "#00d2ff", c2: "#3a7bd5", c3: "#00c6ff", c4: "#0072ff", name: "Ocean" },
        forest:    { c1: "#a8e063", c2: "#56ab2f", c3: "#11998e", c4: "#38ef7d", name: "Forest" },
        fire:      { c1: "#f12711", c2: "#f5af19", c3: "#ff512f", c4: "#dd2476", name: "Fire" },
        candy:     { c1: "#ff9a9e", c2: "#fecfef", c3: "#a18cd1", c4: "#fbc2eb", name: "Candy" },
        midnight:  { c1: "#2c3e50", c2: "#4ca1af", c3: "#c4e0e5", c4: "#2c3e50", name: "Midnight" },
        gold:      { c1: "#f7971e", c2: "#ffd200", c3: "#ffecd2", c4: "#fcb045", name: "Gold" },
    };

    let currentPalette = "neon";
    let currentTheme = "dark";

    // Build palette swatches
    const grid = document.getElementById("paletteGrid");
    Object.entries(palettes).forEach(([key, pal]) => {
        const swatch = document.createElement("div");
        swatch.className = `palette-swatch ${key === currentPalette ? "active" : ""}`;
        swatch.dataset.key = key;
        swatch.style.background = `linear-gradient(135deg, ${pal.c1}, ${pal.c2})`;
        swatch.innerHTML = `<span class="swatch-check">&#10003;</span>`;
        swatch.onclick = () => setPalette(key);
        grid.appendChild(swatch);
    });

    function setPalette(key) {
        currentPalette = key;
        const p = palettes[key];

        // Update gradient stops
        document.getElementById("stop1").setAttribute("stop-color", p.c1);
        document.getElementById("stop2").setAttribute("stop-color", p.c2);
        document.getElementById("stop3").setAttribute("stop-color", p.c3);

        // Update lines via CSS variables
        const box = document.getElementById("logoBox");
        box.style.setProperty("--c1", p.c1);
        box.style.setProperty("--c2", p.c2);
        box.style.setProperty("--c3", p.c3);
        box.style.setProperty("--c4", p.c4);

        // Update active swatch
        document.querySelectorAll(".palette-swatch").forEach(s => s.classList.toggle("active", s.dataset.key === key));

        replayAnimation();
    }

    function setTheme(mode) {
        currentTheme = mode;
        document.body.setAttribute("data-theme", mode);

        document.querySelectorAll(".btn[data-mode]").forEach(b => {
            b.classList.toggle("active", b.dataset.mode === mode);
        });
    }

    function replayAnimation() {
        const path = document.getElementById("nPath");
        const fold = document.getElementById("nFold");
        const lines = [document.getElementById("line1"), document.getElementById("line2"), document.getElementById("line3")];
        const name = document.querySelector(".app-name");
        const wrap = document.getElementById("logoWrap");

        // Reset all
        path.style.animation = "none";
        fold.style.animation = "none";
        lines.forEach(l => l.style.animation = "none");
        name.style.animation = "none";
        wrap.style.animation = "none";

        // Force reflow
        void path.offsetWidth;

        // Re-apply
        const len = path.getTotalLength();
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;

        path.style.animation = "drawN 1.5s cubic-bezier(0.45, 0, 0.55, 1) forwards 0.4s";
        fold.style.animation = "foldReveal 0.5s ease forwards 1.6s";
        lines[0].style.animation = "slideIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 1.8s";
        lines[1].style.animation = "slideIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 2.0s";
        lines[2].style.animation = "slideIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 2.2s";
        name.style.animation = "textUp 0.8s ease forwards 2.5s";
        wrap.style.animation = "boxEnter 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards";
    }

    // Initialize
    setPalette("neon");
    setTheme("dark");
    replayAnimation();

    // 3D tilt
    const stage = document.getElementById("stage");
    const wrap = document.getElementById("logoWrap");
    stage.addEventListener("mousemove", e => {
        const rect = wrap.getBoundingClientRect();
        const x = e.clientX - (rect.left + rect.width / 2);
        const y = e.clientY - (rect.top + rect.height / 2);
        const ry = (x / rect.width) * 15;
        const rx = -(y / rect.height) * 15;
        wrap.style.transform = `perspective(1200px) rotateX(${rx}deg) rotateY(${ry}deg)`;
        wrap.style.transition = "transform 0.12s ease-out";
    });
    stage.addEventListener("mouseleave", () => {
        wrap.style.transform = "perspective(1200px) rotateX(0deg) rotateY(0deg)";
        wrap.style.transition = "transform 0.4s cubic-bezier(0.22, 1, 0.36, 1)";
    });
</script>

</body>
</html>
